# ─────────────────────────────────────────────────────────────────────────────
#  Настройки агента поиска работы
#  Меняешь этот файл → коммитишь → со следующего запуска агент работает по-новому.
#
#  Как пишутся слова в фильтрах:
#    "подработ"     — ищется по подстроке (найдёт «подработка», «подработку»)
#    "qa", "18+"    — короткие (до 3 символов) ищутся только целым словом
#    "re:..."       — регулярное выражение для хитрых случаев
#  Регистр и ё/е не важны.
# ─────────────────────────────────────────────────────────────────────────────

agent:
  interval_minutes: 20     # как часто опрашивать сайты (на GitHub Actions задаётся ещё и в cron)
  max_per_run: 25          # больше вакансий за один раз не присылать (остальные — одной строкой)
  first_run: send          # send   — сразу прислать подходящие свежие вакансии
                           # silent — на первом запуске только запомнить, присылать со следующих
  snippet_length: 400      # сколько символов описания показывать в сообщении
  alert_after_failures: 6  # предупредить в Telegram, если сайт не отвечает N раз подряд
  remember_days: 60        # сколько дней помнить отправленные (чтобы не повторяться)

# ── Критерии: студент, удалёнка, подработка по вечерам и выходным ────────────
# Свободное время: пн с 15:00, вт весь день, ср с 19:00, чт и пт с 17:00, сб и вс весь день.
# Точные часы из вакансий не вытащить, поэтому ищем признаки гибкого/неполного графика.
search:
  query: ""                # поиск на сайтах не сужаем — отбор делают фильтры ниже

filters:
  remote_only: true        # только удалёнка; если сайт формат не сообщает — ищем слова ниже
  remote_keywords: [удален, дистанц, remote, "из дома", "home office", "work from home"]

  # Каждая группа — «хотя бы одно слово из группы». Сейчас группа одна: график подходит студенту.
  keyword_groups:
    - - "re:частичн\\w* занятост"
      - "re:неполн\\w* (рабоч|занят|день|недел|ставк)"
      - "re:гибк\\w* (график|режим|расписани|час)"
      - "свободный график"
      - "re:удобн\\w* (график|время)"
      - "re:(сам|сами) (выбира|составля|планиру)"
      - "подработ"
      - "re:вечер(ам|н|ом)"
      - "по выходным"
      - "в выходные"
      - "студент"
      - "стажир"
      - "стажер"
      - "без опыта"
      - "re:проектн\\w* (работ|занят|основ)"
      - "сдельн"
      - "фриланс"
      - "re:\\d+\\s*[-–]?\\s*\\d*\\s*час\\w* в (день|неделю)"
      - "part-time"
      - "part time"
      - "re:flexible (working )?(hours|schedule)"
      - "freelance"
      - "re:\\bintern(ship)?s?\\b"
      - "student"
      - "entry level"
      - "entry-level"

  # Не для студента / не вакансия — смотрим только в названии
  exclude_title_keywords:
    - senior
    - "re:\\blead\\b"
    - "head of"
    - director
    - principal
    - "re:\\bstaff\\b"
    - architect
    - chief
    - "re:\\bvp\\b"
    - руководител
    - директор
    - ведущ
    - старш
    - главн
    - тимлид
    - "team lead"
    - резюме               # в каналах публикуют и резюме соискателей
    - "re:^курс"           # реклама курсов
    - доход                # «доход от 70 000 для новичков» вместо зарплаты — типичная приманка
    - лекци
    - вебинар
    - мастер-класс

  # Защита от мошенников и рекламы — смотрим везде
  exclude_keywords:
    - "re:\\bдроп(п?ер\\w*|ы|ов|ам|ом)\\b"   # дропы: «приём платежей на свою карту» — это уголовка
    - "re:(прием|принима)\\w* (платеж|перевод|денег|денежн)"
    - "re:перевод\\w* (денег|средств) (на|с|через) (сво|тво|ваш)?\\w* ?карт"
    - обнал
    - закладк
    - кладмен
    - "re:банковск\\w* карт"
    - "re:оформ\\w* (на себя )?карт"
    - "re:арбитраж\\w* (крипт|трафик)"
    - p2p
    - казино
    - букмекер
    - беттинг
    - вебкам
    - webcam
    - onlyfans
    - "18+"
    - "re:(без|никаких|минимальн\\w*|небольш\\w*) вложени"  # «без вложений» — типичная приманка
    - "re:вложени\\w* (от|денег|средств)"
    - "re:пассивн\\w* доход"
    - "сетевой маркетинг"
    - mlm
    - млм
    - пирамид
    - лайк                 # «лайкать посты/отзывы за деньги»
    - "re:\\berid\\b"       # рекламные посты в Telegram
    - "#реклама"
  exclude_in: [title, description, tags, company]

  search_in: [title, tags, description, company]
  require_salary: false
  max_age_days: 5          # не присылать вакансии старше N дней

# ── Сайты ────────────────────────────────────────────────────────────────────
# enabled: false — выключить. interval_minutes / query — можно задать отдельно для сайта.
sources:
  # --- русскоязычные ---
  telegram:                # публичные каналы с вакансиями (имя без @)
    enabled: true
    channels:
      - onlinevakansii     # удалёнка, «без опыта», «гибкий график»
      - jobforjunior       # стажировки и джуны
      - textodromo         # тексты, редактура, копирайтинг
      - normrabota         # контент, маркетинг, НКО
      - digital_jobster    # маркетинг, SMM, digital
      - marketing_jobs     # маркетинг
  habr_career:             # Хабр Карьера (IT)
    enabled: true
    remote: true           # только «можно удалённо»
  trudvsem:                # «Работа России», госбаза вакансий по всей стране
    enabled: true
    pages: 5               # удалёнки мало, поэтому листаем 5 страниц по 100
  superjob:                # много подработки для студентов; нужен бесплатный ключ → секрет SUPERJOB_API_KEY
    enabled: false
    remote: true
  hh:                      # hh.ru: с 2026 г. API только с токеном → секрет HH_ACCESS_TOKEN
    enabled: false
    remote: true
  dou:                     # DOU.ua (Украина, IT)
    enabled: false

  # --- международные (на английском), только part-time ---
  remoteok:
    enabled: true
  weworkremotely:
    enabled: true
  remotive:
    enabled: true
  himalayas:
    enabled: true
  jobicy:
    enabled: true
  arbeitnow:               # Германия, обычно нужен немецкий
    enabled: false

  # --- любые другие сайты с RSS-лентой ---
  rss:
    feeds: []
    #  - name: my-feed
    #    title: "Мой сайт"
    #    url: "https://example.com/jobs.rss?q={query}"   # {query} заменится на search.query
