name: Job Agent

# Агент поиска работы: каждые 20 минут опрашивает сайты вакансий и присылает новые в Telegram.
# Секреты (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — обязательно
#   SUPERJOB_API_KEY, HH_ACCESS_TOKEN     — по желанию, для SuperJob и hh.ru
#   JOB_AGENT_OVERRIDES                   — по желанию, критерии в виде YAML (если не хочешь светить их в репо)

on:
  schedule:
    # не ровно в :00 — в начале часа GitHub под нагрузкой пропускает запуски
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        default: run
        options:
          - run            # обычный запуск
          - dry-run        # показать в логе, что нашлось, ничего не отправляя
          - test-telegram  # прислать тестовое сообщение

permissions:
  contents: read

concurrency:
  group: job-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-agent/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore memory (already sent vacancies)
        uses: actions/cache/restore@v5
        with:
          path: job-agent/state
          key: job-agent-state-v2-${{ github.run_id }}
          restore-keys: job-agent-state-v2-

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
          JOB_AGENT_OVERRIDES: ${{ secrets.JOB_AGENT_OVERRIDES }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            test-telegram) python -m jobagent --test-telegram ;;
            dry-run)       python -m jobagent --dry-run --preview 2 ;;
            *)             python -m jobagent ;;
          esac

      - name: Save memory
        if: always() && hashFiles('job-agent/state/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: job-agent/state
          key: job-agent-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
